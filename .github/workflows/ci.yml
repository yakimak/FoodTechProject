name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            ml-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r ml-service/requirements.txt

      - name: API tests
        working-directory: api
        run: pytest -q

      - name: ML tests
        working-directory: ml-service
        run: pytest -q

      - name: Compile check
        run: python -m compileall -q api etl dashboard ml-service

      - name: Lint
        run: ruff check api ml-service etl dashboard
